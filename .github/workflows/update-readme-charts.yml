name: Update README exchange-rate charts

on:
  workflow_dispatch:
  schedule:
    # Once daily at 05:17 UTC. GitHub may start scheduled jobs a little later.
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: update-readme-charts
  cancel-in-progress: false

jobs:
  update-charts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system font for Persian labels
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Install chart dependencies
        run: python -m pip install --upgrade pip requests pandas matplotlib arabic-reshaper python-bidi

      - name: Fetch latest TGJU data and regenerate charts
        run: python scripts/update_readme_charts.py

      - name: Commit updated charts if changed
        run: |
          if git diff --quiet -- smple_trend_exchange_rate.png smple_trend_exchange_rate_p.png smple_trend_exchange_rate_d.png; then
            echo "Charts have not changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smple_trend_exchange_rate.png smple_trend_exchange_rate_p.png smple_trend_exchange_rate_d.png
          git commit -m "Update README exchange-rate charts"
          git push
